<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Tierra · Earth Layers — 4º Primaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light mode - warm cream to avoid glare for dyslexia */
      --bg: #FAF6EE;
      --surface: #FFFFFF;
      --surface-soft: #F2ECE1;
      --surface-tint: #FFF6E0;
      --text: #1E293B;
      --text-muted: #526075;
      --border: #DDD3C2;
      --primary: #124578;      /* Obradoiro Navy */
      --primary-light: #E6EFF8;
      --accent: #EAB308;       /* Obradoiro Gold */
      --accent-soft: #FEF3C7;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --warn: #B45309;
      --warn-bg: #FEF3C7;
      --shadow: 0 4px 14px rgba(18, 69, 120, 0.08);
      --radius: 18px;
      --font-main: 'Lexend', 'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #141B24;
      --surface: #1E2836;
      --surface-soft: #263345;
      --surface-tint: #2C291E;
      --text: #F1F5F9;
      --text-muted: #CBD5E1;
      --border: #384960;
      --primary: #60A5FA;
      --primary-light: #1E3A5F;
      --accent: #FACC15;
      --accent-soft: #3D3517;
      --success: #4ADE80;
      --success-bg: #143D24;
      --warn: #FBBF24;
      --warn-bg: #3E2D12;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      letter-spacing: 0.025em;
      word-spacing: 0.08em;
      transition: background-color 0.25s, color 0.25s;
      padding-bottom: 60px;
    }

    body.large-text { font-size: 1.15rem; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, background-color 0.2s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Header */
    .topbar {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow);
    }
    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo { width: 44px; height: 50px; flex-shrink: 0; }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn {
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
    }
    .ctrl-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
    [data-theme="dark"] .ctrl-btn.active { color: #0F172A; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab-btn {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .tab-btn span.tab-icon { font-size: 1.5rem; }
    .tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
    [data-theme="dark"] .tab-btn.active { color: #0F172A; }

    /* Block Filter & Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .block-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 38px;
    }
    .pill.active {
      background: var(--accent);
      color: #1E293B;
      border-color: #CA8A04;
    }

    /* Big Idea Banner */
    .big-picture {
      background: var(--primary-light);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Vocab Grid & Focus View */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .vocab-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .vocab-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .svg-box {
      width: 82px;
      height: 82px;
      flex-shrink: 0;
      background: var(--surface-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .svg-box svg { width: 100%; height: 100%; }
    .word-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .word-trans {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .def-text {
      font-size: 1rem;
      margin: 4px 0;
    }
    .think-box {
      background: var(--surface-tint);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.92rem;
    }
    .speak-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
    }

    /* Focus Mode (1 card at a time) */
    .focus-wrap {
      max-width: 560px;
      margin: 0 auto;
    }
    .focus-card {
      padding: 24px;
      text-align: center;
      align-items: center;
    }
    .focus-card .svg-box {
      width: 150px;
      height: 150px;
    }
    .focus-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 10px;
    }
    .nav-btn {
      background: var(--primary);
      color: #FFF;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      min-width: 115px;
    }
    [data-theme="dark"] .nav-btn { color: #0F172A; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* TAB 2: Flashcards (Oral Practice) */
    .flash-stage {
      max-width: 540px;
      margin: 0 auto;
    }
    .flash-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      flex-wrap: wrap;
      gap: 8px;
    }
    .flashcard {
      background: var(--surface);
      border: 3px solid var(--primary);
      border-radius: 24px;
      padding: 26px 22px;
      min-height: 350px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      position: relative;
    }
    .flashcard .svg-box {
      width: 160px;
      height: 160px;
    }
    .big-action-btn {
      background: var(--primary);
      color: #FFF;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    [data-theme="dark"] .big-action-btn { color: #0F172A; }
    .secondary-btn {
      background: var(--surface-soft);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .eval-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .btn-knew {
      background: var(--success-bg);
      color: var(--success);
      border: 2px solid var(--success);
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 1rem;
    }
    .btn-review {
      background: var(--warn-bg);
      color: var(--warn);
      border: 2px solid var(--warn);
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 1rem;
    }

    /* TAB 3: Exercises */
    .ex-progress-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--surface);
      padding: 12px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
    }
    .ex-step {
      padding: 7px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .ex-step.current {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }
    [data-theme="dark"] .ex-step.current { color: #0F172A; }
    .ex-step.done {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success);
    }

    .ex-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .ex-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin: 0; }

    /* Feedback & Scaffolding Box */
    .feedback-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      display: none;
    }
    .feedback-box.show { display: block; animation: popIn 0.25s ease; }
    .feedback-box.ok { background: var(--success-bg); color: var(--success); border: 2px solid var(--success); }
    .feedback-box.hint { background: var(--warn-bg); color: var(--warn); border: 2px solid var(--warn); }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .shake { animation: gentleShake 0.3s ease; }

    /* Word Chips & Blanks */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
      padding: 12px;
      background: var(--surface-soft);
      border-radius: 14px;
    }
    .chip {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--primary);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.98rem;
      font-weight: 700;
    }
    .chip.selected {
      background: var(--accent);
      color: #1E293B;
      border-color: #CA8A04;
      transform: scale(1.04);
    }
    .chip.used { opacity: 0.35; text-decoration: line-through; pointer-events: none; }

    .blank-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 135px;
      min-height: 38px;
      padding: 4px 12px;
      margin: 2px 4px;
      border: 2.5px dashed var(--primary);
      border-radius: 10px;
      background: var(--surface-soft);
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      vertical-align: middle;
    }
    .blank-slot.active-slot { border-style: solid; background: var(--accent-soft); }
    .blank-slot.correct { border-style: solid; border-color: var(--success); background: var(--success-bg); color: var(--success); }

    .sentence-row {
      padding: 10px 12px;
      margin-bottom: 10px;
      background: var(--bg);
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 1.02rem;
    }

    /* Diagram Exercise Layout */
    .diagram-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: center;
    }
    .diagram-svg {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      display: block;
    }
    .num-list-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .num-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: #FFF;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    [data-theme="dark"] .num-badge { color: #0F172A; }

    /* Matching Exercise */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 14px;
    }
    .match-col { display: flex; flex-direction: column; gap: 10px; }
    .match-item {
      background: var(--surface-soft);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 0.95rem;
      min-height: 70px;
      color: var(--text);
    }
    .match-item.selected { border-color: var(--accent); background: var(--accent-soft); }
    .match-item.matched { border-color: var(--success); background: var(--success-bg); color: var(--success); opacity: 0.85; pointer-events: none; }

    /* Option buttons (MC / TF / Plates) */
    .choice-row {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .choice-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .opt-btn {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .opt-btn.correct { background: var(--success-bg); color: var(--success); border-color: var(--success); }

    /* Group Sorting */
    .sort-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }
    .sort-box {
      background: var(--bg);
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 12px;
      min-height: 160px;
      text-align: center;
      cursor: pointer;
    }
    .sort-box h4 { margin: 6px 0 10px; color: var(--primary); }
    .sorted-pill {
      display: inline-block;
      background: var(--success-bg);
      color: var(--success);
      border: 1.5px solid var(--success);
      border-radius: 999px;
      padding: 4px 12px;
      margin: 4px;
      font-weight: 700;
      font-size: 0.88rem;
    }

    @media (max-width: 720px) {
      .tabs { grid-template-columns: 1fr; }
      .tab-btn { flex-direction: row; justify-content: flex-start; padding: 12px 16px; gap: 10px; }
      .diagram-layout { grid-template-columns: 1fr; }
      .match-grid { grid-template-columns: 1fr; }
      .sort-cols { grid-template-columns: 1fr; }
      .topbar-inner { justify-content: center; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <!-- Obradoiro International School emblem SVG -->
      <svg class="brand-logo" viewBox="0 0 100 112" aria-label="Obradoiro International School">
        <path d="M50 4 L94 22 L86 78 L50 108 L14 78 L6 22 Z" fill="#FFFFFF" stroke="#124578" stroke-width="5"/>
        <text x="50" y="30" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="900" font-size="11.5" fill="#F2D024">OBRADOIRO</text>
        <circle cx="50" cy="40" r="6.5" fill="#124578"/>
        <path d="M35 50 H65 V55 H54 V66 H62 V79 H54 V86 H59 V90 H41 V86 H46 V79 H38 V66 H46 V55 H35 Z" fill="#124578"/>
        <rect x="41" y="69" width="6" height="7" fill="#FFFFFF"/>
        <rect x="53" y="69" width="6" height="7" fill="#FFFFFF"/>
        <rect x="48.5" y="55" width="3" height="28" fill="#FFFFFF"/>
        <text x="50" y="100" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="700" font-size="6.2" fill="#124578">INTERNATIONAL SCHOOL</text>
      </svg>
      <div>
        <div class="brand-title" id="ui-app-title">La Tierra, Placas y Volcanes</div>
        <div class="brand-sub" id="ui-app-sub">4º Primaria · Estudio visual adaptado</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-lang" onclick="toggleLang()">🌐 <span>ES</span></button>
      <button class="ctrl-btn active" id="btn-sound" onclick="toggleSound()">🔊 <span id="lbl-sound">Sonido ON</span></button>
      <button class="ctrl-btn" id="btn-theme" onclick="toggleTheme()">☀️ <span id="lbl-theme">Luz clara</span></button>
      <button class="ctrl-btn" id="btn-textsize" onclick="toggleTextSize()">Aa+</button>
    </div>
  </div>
</header>

<main class="container">
  <!-- Main Navigation Tabs -->
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-learn" onclick="switchTab('learn')">
      <span class="tab-icon">📖</span>
      <span id="lbl-tab-learn">1. Aprender y Memorizar</span>
    </button>
    <button class="tab-btn" id="tab-oral" onclick="switchTab('oral')">
      <span class="tab-icon">🗣️</span>
      <span id="lbl-tab-oral">2. Definir Oralmente</span>
    </button>
    <button class="tab-btn" id="tab-ex" onclick="switchTab('ex')">
      <span class="tab-icon">✏️</span>
      <span id="lbl-tab-ex">3. Ejercicios Prácticos</span>
    </button>
  </nav>

  <!-- Block Selector (Shown on Tab 1 & Tab 2) -->
  <section class="toolbar" id="block-toolbar">
    <div class="block-pills" id="block-pills"></div>
    <div id="learn-view-toggle">
      <button class="ctrl-btn" id="btn-focus-mode" onclick="toggleFocusMode()">🎯 <span id="lbl-focus">Modo Enfoque (1 a 1)</span></button>
    </div>
  </section>

  <!-- TAB 1: LEARN & MEMORIZE -->
  <section id="panel-learn">
    <div class="big-picture" id="big-picture-box"></div>
    <div id="learn-content"></div>
  </section>

  <!-- TAB 2: ORAL FLIP CARDS -->
  <section id="panel-oral" class="hidden">
    <div class="flash-stage">
      <div class="flash-stats">
        <span id="flash-counter">Tarjeta 1 / 32</span>
        <span>⭐ <span id="lbl-mastered">Dominadas:</span> <strong id="flash-mastered-count">0</strong></span>
        <button class="ctrl-btn" onclick="resetFlashcards()">🔄 <span id="lbl-reset-cards">Reiniciar mazo</span></button>
      </div>
      <div class="flashcard" id="flashcard-box"></div>
      <div class="focus-nav">
        <button class="nav-btn" id="flash-prev" onclick="moveFlash(-1)">⬅️ <span id="lbl-prev1">Anterior</span></button>
        <button class="nav-btn" id="flash-next" onclick="moveFlash(1)"><span id="lbl-next1">Siguiente</span> ➡️</button>
      </div>
    </div>
  </section>

  <!-- TAB 3: EXERCISES -->
  <section id="panel-ex" class="hidden">
    <div class="ex-progress-bar" id="ex-steps"></div>
    <div class="ex-card" id="ex-stage"></div>
  </section>
</main>

<script>
/* =========================================================
   STATE & SETTINGS
   ========================================================= */
let lang = 'es'; // 'es' | 'en'
let soundOn = true;

/* =========================================================
   AUDIO (TEXT-TO-SPEECH & GENTLE WEB AUDIO FEEDBACK)
   ========================================================= */
let audioCtx = null;
function playTone(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'ok') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.09);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now); osc.stop(now + 0.45);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(200, now + 0.18);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now); osc.stop(now + 0.22);
    }
  } catch (e) {}
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function speak(htmlText) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(stripHtml(htmlText));
  utter.lang = lang === 'es' ? 'es-ES' : 'en-GB';
  utter.rate = 0.92;
  window.speechSynthesis.speak(utter);
}

/* =========================================================
   CONTROLS & NAVIGATION
   ========================================================= */
function toggleLang() {
  lang = lang === 'es' ? 'en' : 'es';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  updateStaticUI();
  renderAll();
}

function toggleSound() {
  soundOn = !soundOn;
  if (!soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  updateStaticUI();
}

function toggleTheme() {
  darkMode = !darkMode;
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  updateStaticUI();
}

function toggleTextSize() {
  document.body.classList.toggle('large-text');
  document.getElementById('btn-textsize').classList.toggle('active');
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-learn').classList.toggle('active', tab === 'learn');
  document.getElementById('tab-oral').classList.toggle('active', tab === 'oral');
  document.getElementById('tab-ex').classList.toggle('active', tab === 'ex');

  document.getElementById('panel-learn').classList.toggle('hidden', tab !== 'learn');
  document.getElementById('panel-oral').classList.toggle('hidden', tab !== 'oral');
  document.getElementById('panel-ex').classList.toggle('hidden', tab !== 'ex');

  document.getElementById('block-toolbar').classList.toggle('hidden', tab === 'ex');
  document.getElementById('learn-view-toggle').classList.toggle('hidden', tab !== 'learn');

  if (tab === 'oral' && flashDeck.length === 0) initFlashDeck();
  renderAll();
}

function selectBlock(b) {
  activeBlock = b;
  focusIdx = 0;
  initFlashDeck();
  renderAll();
}

function toggleFocusMode() {
  focusMode = !focusMode;
  focusIdx = 0;
  updateStaticUI();
  renderLearn();
}

function getFilteredVocab() {
  return activeBlock === 0 ? VOCAB : VOCAB.filter(v => v.block === activeBlock);
}

function updateStaticUI() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById('ui-app-title').textContent = t.appTitle;
  document.getElementById('ui-app-sub').textContent = t.appSub;
  document.getElementById('btn-lang').innerHTML = `🌐 <span>${lang.toUpperCase()}</span>`;
  document.getElementById('btn-sound').classList.toggle('active', soundOn);
  document.getElementById('btn-sound').innerHTML = `${soundOn ? '🔊' : '🔇'} <span>${soundOn ? t.soundOn : t.soundOff}</span>`;
  document.getElementById('btn-theme').innerHTML = `${darkMode ? '🌙' : '☀️'} <span>${darkMode ? t.dark : t.light}</span>`;
  document.getElementById('lbl-tab-learn').textContent = t.tabLearn;
  document.getElementById('lbl-tab-oral').textContent = t.tabOral;
  document.getElementById('lbl-tab-ex').textContent = t.tabEx;
  document.getElementById('lbl-focus').textContent = focusMode ? t.focusOn : t.focusOff;
  document.getElementById('btn-focus-mode').classList.toggle('active', focusMode);
  document.getElementById('lbl-mastered').textContent = t.mastered;
  document.getElementById('lbl-reset-cards').textContent = t.resetCards;
  document.getElementById('lbl-prev1').textContent = t.prev;
  document.getElementById('lbl-next1').textContent = t.next;
}

function renderBlockPills() {
  const t = UI[lang];
  const el = document.getElementById('block-pills');
  let html = `<button class="pill ${activeBlock===0?'active':''}" onclick="selectBlock(0)">${t.allBlocks}</button>`;
  for (let b = 1; b <= 4; b++) {
    html += `<button class="pill ${activeBlock===b?'active':''}" onclick="selectBlock(${b})">${t.blocks[b]}</button>`;
  }
  el.innerHTML = html;
}

/* =========================================================
   TAB 1: LEARN & MEMORIZE
   ========================================================= */
function renderLearn() {
  const t = UI[lang];
  const other = lang === 'es' ? 'en' : 'es';
  document.getElementById('big-picture-box').innerHTML = `
    <div>${t.bigIdeas[activeBlock]}</div>
    <button class="speak-btn" onclick="speak(UI[lang].bigIdeas[${activeBlock}])">🔊 ${t.listen}</button>
  `;

  const list = getFilteredVocab();
  const container = document.getElementById('learn-content');

  if (!focusMode) {
    container.innerHTML = `<div class="vocab-grid">` + list.map(v => {
      const item = v[lang];
      const trans = v[other].word;
      return `
        <article class="vocab-card">
          <div class="vocab-top">
            <div class="svg-box">${v.svg}</div>
            <div>
              <h3 class="word-title">${item.word}</h3>
              <div class="word-trans">${t.inOther} ${trans}</div>
            </div>
          </div>
          <p class="def-text">${item.def}</p>
          <div class="think-box"><strong>${t.think}</strong> ${item.think}</div>
          <button class="speak-btn" onclick="speakVocab('${v.id}')">🔊 ${t.listen}</button>
        </article>`;
    }).join('') + `</div>`;
  } else {
    if (focusIdx >= list.length) focusIdx = 0;
    const v = list[focusIdx];
    const item = v[lang];
    const trans = v[other].word;
    container.innerHTML = `
      <div class="focus-wrap">
        <article class="vocab-card focus-card">
          <div style="font-size:0.85rem;font-weight:700;color:var(--text-muted);">${focusIdx+1} / ${list.length}</div>
          <div class="svg-box">${v.svg}</div>
          <h3 class="word-title" style="font-size:1.5rem;">${item.word}</h3>
          <div class="word-trans">${t.inOther} ${trans}</div>
          <p class="def-text" style="font-size:1.12rem;">${item.def}</p>
          <div class="think-box" style="width:100%;text-align:left;"><strong>${t.think}</strong> ${item.think}</div>
          <button class="speak-btn" style="align-self:center;" onclick="speakVocab('${v.id}')">🔊 ${t.listen}</button>
        </article>
        <div class="focus-nav">
          <button class="nav-btn" ${focusIdx===0?'disabled':''} onclick="focusIdx--;renderLearn();">⬅️ ${t.prev}</button>
          <button class="nav-btn" ${focusIdx===list.length-1?'disabled':''} onclick="focusIdx++;renderLearn();">${t.next} ➡️</button>
        </div>
      </div>`;
  }
}

function speakVocab(id) {
  const v = VOCAB.find(x => x.id === id);
  if (!v) return;
  const item = v[lang];
  speak(`${item.word}. ${item.def}`);
}

/* =========================================================
   TAB 2: ORAL PRACTICE / FLIP CARDS
   ========================================================= */
function initFlashDeck() {
  flashDeck = getFilteredVocab().map(v => v.id);
  flashIdx = 0;
  flashFlipped = false;
  flashPeekWord = false;
}

function resetFlashcards() {
  masteredIds.clear();
  initFlashDeck();
  renderOral();
}

function renderOral() {
  const t = UI[lang];
  const other = lang === 'es' ? 'en' : 'es';
  document.getElementById('flash-mastered-count').textContent = masteredIds.size;
  const box = document.getElementById('flashcard-box');

  if (flashDeck.length === 0) {
    document.getElementById('flash-counter').textContent = `0 / 0`;
    box.innerHTML = `
      <div style="font-size:2.5rem;">🏆</div>
      <p style="font-size:1.15rem;font-weight:700;">${t.deckFinished}</p>
      <button class="big-action-btn" onclick="resetFlashcards()">🔄 ${t.resetCards}</button>
    `;
    document.getElementById('flash-prev').disabled = true;
    document.getElementById('flash-next').disabled = true;
    return;
  }

  if (flashIdx >= flashDeck.length) flashIdx = 0;
  if (flashIdx < 0) flashIdx = flashDeck.length - 1;

  document.getElementById('flash-counter').textContent = `${t.card} ${flashIdx + 1} ${t.of} ${flashDeck.length}`;
  document.getElementById('flash-prev').disabled = flashDeck.length <= 1;
  document.getElementById('flash-next').disabled = flashDeck.length <= 1;

  const v = VOCAB.find(x => x.id === flashDeck[flashIdx]);
  const item = v[lang];

  if (!flashFlipped) {
    box.innerHTML = `
      <span class="pill" style="font-size:0.8rem;">${t.blocks[v.block]}</span>
      <div class="svg-box">${v.svg}</div>
      <p style="font-weight:600;color:var(--text-muted);margin:0;">${t.oralPrompt}</p>
      ${flashPeekWord ? `<div class="word-title" style="font-size:1.4rem;">${item.word}</div>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">

function moveFlash(delta) {
  flashIdx = (flashIdx + delta + flashDeck.length) % flashDeck.length;
  flashFlipped = false;
  flashPeekWord = false;
  renderOral();
}

function markFlash(knew) {
  const id = flashDeck[flashIdx];
  if (knew) {
    playTone('ok');
    masteredIds.add(id);
    flashDeck.splice(flashIdx, 1);
    if (flashIdx >= flashDeck.length) flashIdx = 0;
  } else {
    // Move current card to end of deck for gentle repetition
    flashDeck.splice(flashIdx, 1);
    flashDeck.push(id);
  }
  flashFlipped = false;
  flashPeekWord = false;
  renderOral();
}

  const box = document.getElementById('ex-feedback');
  if (!box) return;
  box.className = `feedback-box show ${isOk ? 'ok' : 'hint'}`;
  box.innerHTML = htmlMsg;
  if (!isOk) {

    setTimeout(() => box.classList.remove('shake'), 350);

function initExState(ex) {
  if (ex.type === 'diagram_earth') {
    exState[ex.id] = { slots: [0, null, null, null, null], activeSlot: 1, done: false };
    // Slot 0 (number 1) is pre-filled as example like in PDF!
  } else if (ex.type === 'diagram_volcano') {
    exState[ex.id] = { slots: [0, null, null, null, null], activeSlot: 1, done: false };
  } else if (ex.type === 'match_3' || ex.type === 'match_4') {
    exState[ex.id] = { selLeft: null, matched: [], wrongCount: 0 };
  } else if (ex.type.startsWith('blanks_')) {
    exState[ex.id] = { slots: [0, null, null, null, null], activeSlot: 1, done: false };
  } else if (ex.type === 'plates_6') {
    exState[ex.id] = { answers: [null, null, null], done: false };
  } else if (ex.type === 'layers_7') {
    exState[ex.id] = { c1: null, c2: null, order: ['', '', ''], done: false };
  } else if (ex.type === 'magma_8') {
    exState[ex.id] = { answers: [null, null, null, null], done: false };
  } else if (ex.type === 'sort_9') {
    exState[ex.id] = { selectedWord: null, groups: { layers:[], volcanoes:[], plates:[] }, done: false };
  } else if (ex.type === 'tf_10') {
    exState[ex.id] = { answers: [null, null, null, null, null], done: false };
